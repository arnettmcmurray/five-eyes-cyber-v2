services:
  db:
    image: pgvector/pgvector:pg16
    container_name: five_eyes_v2_db
    environment:
      POSTGRES_DB: five_eyes_v2
      POSTGRES_USER: five_eyes_user
      POSTGRES_PASSWORD: five_eyes_dev
    ports:
      - "5433:5432"
    volumes:
      - db_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U five_eyes_user -d five_eyes_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: five_eyes_v2_mailpit
    ports:
      - "8025:8025"   # web UI  →  http://localhost:8025
      - "1025:1025"   # SMTP    →  matches SMTP_HOST=localhost SMTP_PORT=1025 in backend/.env
    restart: unless-stopped

volumes:
  db_data_v2:
